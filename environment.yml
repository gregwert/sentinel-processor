# Conda environment for sentinel-processor
#
# Recommended setup (avoids slow conda-forge dependency solve):
#   conda create -n sentinel-processor python=3.11 -y
#   conda activate sentinel-processor
#   pip install -r requirements-local.txt
#
# Alternative (full conda solve — slower but more reproducible):
#   conda env create -f environment.yml

name: sentinel-processor
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - rasterio==1.3.10
      - numpy==1.26.4
      - opencv-python==4.9.0.80
      - scikit-image==0.23.2
      - scipy==1.13.0
      - streamlit==1.35.0
      - tornado==6.2.0
      - Pillow==10.3.0
      - tqdm==4.66.4
      - pyyaml==6.0.1
